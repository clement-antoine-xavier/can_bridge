name: Arduino CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: arduino/arduino-lint-action@v3.0.0
        with:
          path: ${{ github.workspace }}
          version: 1.3.0
          compliance: strict
          library-manager: false
          project-type: sketch
          recursive: true
          report-file: arduino-lint-report.txt
          verbose: true
          token: ${{ secrets.GITHUB_TOKEN }}

  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: arduino/compile-sketches@v1.1.3
        with:
          cli-version: latest
          fqbn: arduino:samd:mkrwifi1010
          platforms: |
            - name: "arduino:samd"
          libraries: "[]"
          sketch-paths: .
          cli-compile-flags: ""
          verbose: false
          sketches-report-path: sketches-reports
          github-token: ${{ secrets.GITHUB_TOKEN }}
          enable-deltas-report: true
          enable-warnings-report: true

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: sketches-reports
          path: sketches-reports
          if-no-files-found: warn
          retention-days: 0
          compression-level: 6
          overwrite: false
          include-hidden-files: false
          archive: true

  report-size-deltas:
    needs: compile
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v7.0.1
        with:
          name: sketches-reports
          path: sketches-reports

      - uses: arduino/report-size-deltas@v1.1.0
        with:
          sketches-reports-source: sketches-reports
          github-token: ${{ secrets.GITHUB_TOKEN }}
